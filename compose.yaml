name: flowmind

services:
  model-init:
    image: flowmind:local
    container_name: flowmind-model-init
    user: "0:0"
    restart: "no"
    volumes:
      - flowmind_models:/models
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /models && chown -R 10001:10001 /models"]
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowmind:local
    container_name: flowmind-web
    init: true
    restart: unless-stopped
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      FLOWMIND_RESULTS_DIR: /app/results
      FLOWMIND_WEB_RESULTS_DIR: /app/results/web_demo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OMP_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
    ports:
      - "${FLOWMIND_BIND_IP:-127.0.0.1}:${FLOWMIND_PORT:-8010}:8000"
    volumes:
      - flowmind_results:/app/results
      - flowmind_models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib, sumolib, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read(); sumolib.checkBinary('sumo'); p=pathlib.Path('/app/results/.healthcheck'); p.write_text('ok'); p.unlink()"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  dataset:
    image: flowmind:local
    container_name: flowmind-dataset
    profiles:
      - dataset
    init: true
    restart: "no"
    environment:
      FLOWMIND_RESULTS_DIR: /app/results
      OMP_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
    volumes:
      - flowmind_results:/app/results
      - flowmind_models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - python
      - -u
      - experiments/run_dataset.py
      - --full-real
      - --resume
      - --keep-going
      - --output-dir
      - /app/results/dataset
      - --no-queue-model
      - --config
      - /app/simulation/rivne_area/focused.sumocfg
      - --zone
      - /app/simulation/rivne_area/central_zone.json

  trainer:
    image: flowmind:local
    container_name: flowmind-trainer
    profiles:
      - training
    init: true
    restart: "no"
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      OMP_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
    volumes:
      - flowmind_results:/app/results
      - flowmind_models:/app/models
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - python
      - -u
      - experiments/train_queue_ensemble.py
      - --dataset-dir
      - /app/results/dataset
      - --output-dir
      - /app/models
      - --rows-per-file
      - ${FLOWMIND_TRAIN_ROWS_PER_FILE:-5000}
      - --jobs
      - ${FLOWMIND_CPU_THREADS:-4}

  evaluation:
    image: flowmind:local
    container_name: flowmind-evaluation
    profiles:
      - evaluation
    init: true
    restart: "no"
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      FLOWMIND_RESULTS_DIR: /app/results
      OMP_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${FLOWMIND_CPU_THREADS:-4}
    volumes:
      - flowmind_results:/app/results
      - flowmind_models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - python
      - -u
      - experiments/run_evaluation.py
      - --replicates
      - ${FLOWMIND_EVALUATION_REPLICATES:-30}
      - --duration
      - ${FLOWMIND_EVALUATION_DURATION:-1800}
      - --workers
      - ${FLOWMIND_EVALUATION_WORKERS:-4}
      - --evaluation-id
      - ${FLOWMIND_EVALUATION_ID:-rivne_full_v1}
      - --results-dir
      - /app/results/evaluation
      - --resume

volumes:
  flowmind_results:
    name: flowmind_results
  flowmind_models:
    name: flowmind_models
