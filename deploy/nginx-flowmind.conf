resolver 127.0.0.11 ipv6=off valid=10s;

upstream flowmind_backend {
    zone flowmind_backend 64k;
    server flowmind-web:8000 resolve;
}

server {
    listen 80;
    server_name myhaven.fun www.myhaven.fun 192.168.0.105;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://flowmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name myhaven.fun www.myhaven.fun 192.168.0.105;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/local-selfsigned/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/local-selfsigned/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://flowmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }
}
